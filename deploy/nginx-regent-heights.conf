# nginx site config for the hosted deployment.
# Serves the built frontend directly; proxies /api and /socket.io to the Node
# app on 127.0.0.1:5000. certbot has appended its own SSL block to the live
# copy on the server — that part isn't reproduced here since it's
# machine-specific (cert paths); re-running `certbot --nginx` regenerates it.
server {
    listen 80;
    server_name YOUR_DOMAIN_OR_SSLIP_ADDRESS;

    root /home/appuser/app-web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
